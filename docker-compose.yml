# ThermoBox: MySQL + REST (always) + one JSF interface of your choice (tomcat or wildfly profile)
# + MQTT broker (mqtt profile).
#
#   docker compose up -d --build                     -> MySQL + REST
#   docker compose --profile tomcat up -d --build    -> + JSF on Tomcat    (port 8081)
#   docker compose --profile wildfly up -d --build   -> + JSF on WildFly   (port 8082)
#   docker compose --profile mqtt up -d              -> + Mosquitto        (port 1883)
#
# The secrets come from the .env file (created by scripts/init-env.sh, see .env.example).

name: thermobox

x-app-env: &app-env
  TZ: ${TZ:-Europe/Paris}
  THERMOBOX_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-thermobox}?allowPublicKeyRetrieval=true&useSSL=false"
  THERMOBOX_DB_USER: ${MYSQL_USER:-thermobox}
  THERMOBOX_DB_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD missing: run scripts/init-env.sh}"
  THERMOBOX_JWT_SECRET: "${THERMOBOX_JWT_SECRET:?THERMOBOX_JWT_SECRET missing (32 characters minimum): run scripts/init-env.sh}"
  THERMOBOX_JWT_TTL_MINUTES: ${THERMOBOX_JWT_TTL_MINUTES:-60}
  # Updates (see README): stable or prerelease channel, daily check, optional GitHub token
  THERMOBOX_UPDATE_CHANNEL: ${THERMOBOX_UPDATE_CHANNEL:-stable}
  THERMOBOX_UPDATE_CHECK: ${THERMOBOX_UPDATE_CHECK:-true}
  THERMOBOX_GITHUB_TOKEN: ${THERMOBOX_GITHUB_TOKEN:-}
  # Devices: simulated (default) or mqtt (with the mqtt profile, or an external broker)
  THERMOBOX_DRIVER: ${THERMOBOX_DRIVER:-simulated}
  THERMOBOX_MQTT_URL: ${THERMOBOX_MQTT_URL:-tcp://mosquitto:1883}
  THERMOBOX_MQTT_USER: ${THERMOBOX_MQTT_USER:-}
  THERMOBOX_MQTT_PASSWORD: ${THERMOBOX_MQTT_PASSWORD:-}
  # JSF interface: Production (default) or Development; true behind an HTTPS proxy
  THERMOBOX_STAGE: ${THERMOBOX_STAGE:-Production}
  THERMOBOX_HTTPS: ${THERMOBOX_HTTPS:-false}

services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD missing: run scripts/init-env.sh}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-thermobox}
      MYSQL_USER: ${MYSQL_USER:-thermobox}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD missing: run scripts/init-env.sh}"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Only from your machine (SQL tools), not from the network
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rest:
    build:
      context: .
      dockerfile: docker/rest/Dockerfile
      args:
        THERMOBOX_VERSION: ${THERMOBOX_VERSION:-dev}
    image: thermobox/rest:local
    restart: unless-stopped
    environment:
      <<: *app-env
      THERMOBOX_HTTP_HOST: 0.0.0.0
      THERMOBOX_HTTP_PORT: "8080"
    ports:
      - "${REST_PORT:-8080}:8080"
    volumes:
      # Updates installed from the interface, database backups (shared with jsf-tomcat)
      - thermobox_data:/var/lib/thermobox
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", ": </dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 40s

  jsf-tomcat:
    profiles: ["tomcat"]
    build:
      context: .
      dockerfile: docker/jsf-tomcat/Dockerfile
      args:
        THERMOBOX_VERSION: ${THERMOBOX_VERSION:-dev}
    image: thermobox/jsf-tomcat:local
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${TOMCAT_PORT:-8081}:8080"
    volumes:
      - thermobox_data:/var/lib/thermobox
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /login.xhtml HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -qE ' (200|30[0-9]) '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  jsf-wildfly:
    profiles: ["wildfly"]
    build:
      context: .
      dockerfile: docker/jsf-wildfly/Dockerfile
      args:
        THERMOBOX_VERSION: ${THERMOBOX_VERSION:-dev}
    image: thermobox/jsf-wildfly:local
    restart: unless-stopped
    environment:
      <<: *app-env
    ports:
      - "${WILDFLY_PORT:-8082}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /login.xhtml HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -qE ' (200|30[0-9]) '"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  # Optional: broker for real devices, with THERMOBOX_DRIVER=mqtt in .env
  # (THERMOBOX_MQTT_URL points to this service by default).
  mosquitto:
    profiles: ["mqtt"]
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  thermobox_data:
  mosquitto_data:
