version: '3.8'

services:
  mysql:
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: thermobox
      MYSQL_USER: thermobox
      MYSQL_PASSWORD: changeit
    volumes:
      - mysql_data:/var/lib/mysql

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  restserver:
    image: thermobox-rest:latest
    environment:
      THERMOBOX_DB_URL: jdbc:mysql://mysql:3306/thermobox
      THERMOBOX_DB_USER: thermobox
      THERMOBOX_DB_PASSWORD: changeit
      THERMOBOX_JWT_SECRET: replace-with-a-strong-secret
      THERMOBOX_JWT_TTL_MINUTES: "60"
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mosquitto

  jsf-wildfly:
    build:
      context: .
      dockerfile: Dockerfile-jsf-wildfly
    container_name: thermobox-jsf-wildfly
    environment:
      THERMOBOX_DB_URL: jdbc:mysql://mysql:3306/thermobox
      THERMOBOX_DB_USER: thermobox
      THERMOBOX_DB_PASSWORD: changeit
    ports:
      - "8082:8080"
    depends_on:
      - mysql
      - restserver

volumes:
  mysql_data:
  mosquitto_data:
  mosquitto_log:
