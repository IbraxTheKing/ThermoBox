<!-- Carte d'une salle du tableau de bord. Attend la variable "r" (SalleResume). -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pt="jakarta.faces.passthrough">
    <!-- view-transition-name: card, name, photo and temperature morph into the detail page -->
    <article class="tb-room tb-ton-#{r.etat.ton} #{r.image ne null ? 'tb-room-photo' : ''}" data-flip="#{r.salle.id}"
             style="view-transition-name: salle-card-#{r.salle.id}; view-transition-class: tb-card">
        <!-- Stretched over the whole card (see .tb-stretched): click anywhere to open the detail. -->
        <h:link outcome="/app/salle" styleClass="tb-stretched" title="Voir le détail de #{r.salle.name}">
            <f:param name="id" value="#{r.salle.id}"/>
            <span class="tb-sr-only">Voir le détail de #{r.salle.name}</span>
        </h:link>

        <h:panelGroup layout="block" styleClass="tb-room-media" rendered="#{r.image ne null}"
                      style="view-transition-name: salle-photo-#{r.salle.id}">
            <img src="#{request.contextPath}#{r.image}" alt="" loading="lazy" decoding="async"/>
        </h:panelGroup>

        <p:commandButton icon="pi #{r.favori ? 'pi-star-fill' : 'pi-star'}"
                         title="#{r.favori ? 'Retirer des favoris' : 'Ajouter aux favoris'}"
                         styleClass="ui-button-flat tb-fav #{r.favori ? 'tb-fav-on' : ''}"
                         action="#{dashboardBean.basculerFavori(r.salle.id)}" process="@this"
                         update=":dashForm:grille" onstart="tbFlip.first()" oncomplete="tbFlip.play()"/>

        <div class="tb-room-head">
            <h3 class="tb-room-name" style="view-transition-name: salle-nom-#{r.salle.id}">#{r.salle.name}</h3>
            <div class="tb-room-path">
                <h:outputText value="#{r.chemin}" rendered="#{not empty r.chemin}"/>
                <h:outputText value="Non rattachée" rendered="#{empty r.chemin}"/>
            </div>
        </div>

        <div class="tb-room-reading">
            <span class="tb-temp-xl" style="view-transition-name: salle-temp-#{r.salle.id}" data-watch="t#{r.salle.id}">
                <h:outputText value="#{r.moyenne}" rendered="#{r.moyenne ne null}">
                    <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                </h:outputText>
                <h:outputText value="—" rendered="#{r.moyenne eq null}"/>
                <span class="tb-deg">°</span>
            </span>
            <div class="tb-room-badges">
                <span class="tb-state">#{r.etat.label}</span>
                <h:panelGroup styleClass="tb-trend" rendered="#{r.tendance.variation ne null}">
                    <i class="pi #{r.tendance.variationIcon}"/>#{r.tendance.variationLabel}
                </h:panelGroup>
            </div>
        </div>

        <!-- Last 24 h: average of the boxes; dashed line = consigne -->
        <!-- Curves are computed after the page is shown (DashboardBean.chargerCourbes): placeholder meanwhile -->
        <h:panelGroup layout="block" styleClass="tb-spark-loading" rendered="#{dashboardBean.courbesEnAttente}"
                      pt:aria-busy="true" pt:aria-label="Courbe des dernières 24 h en cours de chargement">
            <svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path d="M0 26 C 12 18, 22 30, 34 22 S 56 10, 68 20 S 88 30, 100 16"/>
            </svg>
            <span class="tb-spark-caption">24 h</span>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="tb-spark #{dashboardBean.courbesNouvelles ? 'tb-spark-new' : ''}"
                      rendered="#{not dashboardBean.courbesEnAttente and r.tendance ne null}">
            <svg class="tb-spark-fill" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path d="#{r.tendance.aire}"/>
            </svg>
            <svg class="tb-spark-stroke" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                <path d="#{r.tendance.ligne}"/>
            </svg>
            <h:panelGroup styleClass="tb-spark-consigne" style="top: #{r.tendance.consigneY}%"
                          rendered="#{r.tendance.consigneY ne null}"/>
            <span class="tb-spark-dot" style="left: #{r.tendance.dernierX}%; top: #{r.tendance.dernierY}%"/>
            <span class="tb-spark-caption">24 h</span>
        </h:panelGroup>
        <h:panelGroup layout="block" styleClass="tb-spark tb-spark-empty"
                      rendered="#{not dashboardBean.courbesEnAttente and r.tendance eq null}">
            Pas encore assez de mesures pour une courbe
        </h:panelGroup>

        <div class="tb-room-foot">
            <span class="tb-consigne-pill" title="#{r.consigneTitre}">
                <i class="pi #{r.consigneSource ne null ? 'pi-sitemap' : 'pi-sliders-h'}"/>
                <h:outputText value="#{r.consigne.value}" rendered="#{r.consigne ne null}">
                    <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                </h:outputText>
                <h:outputText value="—" rendered="#{r.consigne eq null}"/>
                °C
                <b>#{r.ecartLabel}</b>
            </span>
            <span class="tb-room-meta">
                <ui:fragment rendered="#{loginBean.canSeeBoitiers}">
                    <i class="pi pi-wifi"/>#{r.boitiers}
                    <h:outputText value="#{r.derniereMesure}" rendered="#{r.derniereMesure ne null}">
                        <f:convertDateTime type="localDateTime" pattern="' · 'dd/MM HH:mm"/>
                    </h:outputText>
                </ui:fragment>
                <!-- VIEWER: no box count (#30), only the time of the last measure -->
                <ui:fragment rendered="#{not loginBean.canSeeBoitiers and r.derniereMesure ne null}">
                    <i class="pi pi-clock"/>
                    <h:outputText value="#{r.derniereMesure}">
                        <f:convertDateTime type="localDateTime" pattern="dd/MM HH:mm"/>
                    </h:outputText>
                </ui:fragment>
            </span>
        </div>
    </article>
</ui:composition>
