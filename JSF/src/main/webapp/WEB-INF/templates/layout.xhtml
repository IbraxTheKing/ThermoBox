<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:insert name="metadata"/>

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>Thermobox – <ui:insert name="title"/></title>
    <h:outputStylesheet name="css/thermobox.css"/>
    <script>
        (function () {
            var root = document.documentElement;

            // Ancienne page : on coupe le flou juste avant que le navigateur la capture
            window.addEventListener('pageswap', function (e) {
                if (e.viewTransition) root.classList.add('tb-vt');
            });

            // Nouvelle page : pas de flou pendant l'animation, puis il revient en fondu
            window.addEventListener('pagereveal', function (e) {
                if (!e.viewTransition) { root.classList.remove('tb-vt'); return; }
                root.classList.add('tb-vt');
                e.viewTransition.finished.finally(function () {
                    requestAnimationFrame(function () { root.classList.remove('tb-vt'); });
                });
            });

            // Retour arrière depuis le cache du navigateur : on ne reste jamais bloqué sans flou
            window.addEventListener('pageshow', function () {
                setTimeout(function () { root.classList.remove('tb-vt'); }, 600);
            });
        })();
    </script>
    <script>
        function tbChartExtender() {
            var mobile = window.matchMedia('(max-width: 640px)').matches;
            var text = 'rgba(255, 255, 255, .85)';
            var grid = 'rgba(255, 255, 255, .10)';
            var font = { family: '"SF Pro Display", "Inter", -apple-system, system-ui, sans-serif', size: mobile ? 11 : 13 };

            var o = this.cfg.config.options = this.cfg.config.options || {};

            // Le graphique prend toute la largeur ET la hauteur de son conteneur
            o.responsive = true;
            o.maintainAspectRatio = false;
            o.layout = { padding: { top: 4, right: 4, bottom: 0, left: 0 } };

            // Légende : texte blanc, petits points ronds au lieu des gros rectangles
            o.plugins = o.plugins || {};
            o.plugins.legend = {
                position: mobile ? 'bottom' : 'top',
                labels: { color: text, font: font, usePointStyle: true, pointStyle: 'circle',
                    boxWidth: 8, boxHeight: 8, padding: mobile ? 12 : 18 }
            };
            o.plugins.tooltip = { mode: 'index', intersect: false, titleFont: font, bodyFont: font };

            // Axes : texte blanc, dates horizontales et espacées, date au-dessus de l'heure
            o.scales = o.scales || {};
            o.scales.x = {
                grid: { color: grid, drawTicks: false },
                ticks: {
                    color: text, font: font, padding: 8,
                    maxRotation: 0, autoSkip: true, maxTicksLimit: mobile ? 4 : 8,
                    callback: function (value) {
                        var label = this.getLabelForValue(value) || '';
                        return label.split(' ');            // "29/09 10:07" → 2 lignes
                    }
                }
            };
            o.scales.y = {
                grid: { color: grid, drawTicks: false },
                border: { display: false },
                ticks: { color: text, font: font, padding: 8, maxTicksLimit: mobile ? 5 : 8 }
            };

            // Courbes plus fines et plus lisibles, sans points sur mobile
            o.elements = {
                point: { radius: mobile ? 0 : 2.5, hoverRadius: 5, hitRadius: 12 },
                line:  { tension: .35, borderWidth: mobile ? 2 : 2.5 }
            };
            o.interaction = { mode: 'index', intersect: false };
        }
    </script>
</h:head>

<h:body>
    <h:form id="menuForm" rendered="#{loginBean.loggedIn}">
        <p:menubar>
            <f:facet name="start">
                <h:link outcome="/app/index" styleClass="tb-brand">
                    <i class="pi pi-sun"/> Thermobox
                </h:link>
            </f:facet>

            <p:menuitem value="Tableau de bord" icon="pi pi-home" outcome="/app/index"/>
            <p:menuitem value="Salles" icon="pi pi-building" outcome="/app/salles"/>
            <p:menuitem value="Températures" icon="pi pi-chart-line" outcome="/app/temperatures"/>
            <p:menuitem value="Utilisateurs" icon="pi pi-users" outcome="/admin/users"
                        rendered="#{loginBean.admin}"/>

            <f:facet name="options">
                <p:linkButton value="#{loginBean.currentUser.username}" icon="pi pi-user"
                              outcome="/app/profil" styleClass="ui-button-flat"/>
                <p:commandButton value="Déconnexion" icon="pi pi-sign-out" action="#{loginBean.logout}"
                                 ajax="false" styleClass="tb-logout"/>
            </f:facet>
        </p:menubar>
    </h:form>

    <p:growl id="growl" showDetail="true" life="4000">
        <p:autoUpdate/>
    </p:growl>

    <h:form id="confirmForm">
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="360">
            <p:commandButton value="Annuler" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
            <p:commandButton value="Confirmer" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
        </p:confirmDialog>
    </h:form>

    <main class="tb-main">
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
