<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      data-theme="#{themeBean.mode}"
      data-ctx="#{request.contextPath}/">

<ui:insert name="metadata"/>

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="theme-color" content="#{themeBean.dark ? '#0f141c' : '#bccde2'}"/>
    <title>Thermobox – <ui:insert name="title"/></title>
    <!-- Loaded early: text measured before it arrives (scroll back to a card) would move -->
    <link rel="preload" href="#{resource['fonts/manrope-latin.woff2']}" as="font" type="font/woff2" crossorigin="anonymous"/>
    <h:outputStylesheet name="css/thermobox.css"/>
    <h:outputScript name="js/thermobox.js" target="head"/>
</h:head>

<h:body styleClass="#{loginBean.loggedIn ? 'tb-app' : 'tb-public'}">
    <h:form id="menuForm" rendered="#{loginBean.loggedIn}" styleClass="tb-shell-nav">
        <!-- Top app bar: phones only (the rail holds these actions on wider screens) -->
        <header class="tb-topbar">
            <h:link outcome="/app/dashboard" styleClass="tb-brand">
                <span class="tb-logo" aria-hidden="true"/>Thermobox
            </h:link>
            <span class="tb-spacer"/>
            <button type="button" class="tb-icon-btn tb-theme-btn" onclick="tbTheme.toggle(this)"
                    title="Changer de thème" aria-label="Changer de thème">
                <i class="pi pi-moon tb-if-light"/><i class="pi pi-sun tb-if-dark"/>
            </button>
            <h:link outcome="/app/profil" styleClass="tb-avatar" title="Mon profil (#{loginBean.currentUser.username})">
                #{loginBean.initiale}
            </h:link>
            <p:commandButton icon="pi pi-sign-out" title="Déconnexion" action="#{loginBean.logout}"
                             ajax="false" styleClass="ui-button-flat tb-logout"/>
        </header>

        <!-- Navigation rail (desktop), bottom navigation bar (phones) -->
        <nav class="tb-rail" aria-label="Navigation principale">
            <h:link outcome="/app/dashboard" styleClass="tb-rail-brand" title="Thermobox">
                <span class="tb-logo" aria-hidden="true"/>
            </h:link>

            <div class="tb-dests">
                <h:link outcome="/app/dashboard"
                        styleClass="tb-dest #{view.viewId eq '/app/dashboard.xhtml' ? 'tb-dest-on' : ''}">
                    <span class="tb-dest-icon"><i class="pi pi-th-large"/></span>
                    <span class="tb-dest-label">Aperçu</span>
                </h:link>
                <h:link outcome="/app/salles"
                        styleClass="tb-dest #{view.viewId eq '/app/salles.xhtml' or view.viewId eq '/app/salle.xhtml' ? 'tb-dest-on' : ''}">
                    <span class="tb-dest-icon"><i class="pi pi-building"/></span>
                    <span class="tb-dest-label">Salles</span>
                </h:link>
                <h:link outcome="/app/temperatures"
                        styleClass="tb-dest #{view.viewId eq '/app/temperatures.xhtml' ? 'tb-dest-on' : ''}">
                    <span class="tb-dest-icon"><i class="pi pi-chart-line"/></span>
                    <span class="tb-dest-label">Mesures</span>
                </h:link>
                <h:link outcome="/admin/users" rendered="#{loginBean.admin}"
                        styleClass="tb-dest #{view.viewId eq '/admin/users.xhtml' ? 'tb-dest-on' : ''}">
                    <span class="tb-dest-icon"><i class="pi pi-users"/></span>
                    <span class="tb-dest-label">Utilisateurs</span>
                </h:link>
                <h:link outcome="/admin/updates" rendered="#{loginBean.admin}"
                        styleClass="tb-dest #{view.viewId eq '/admin/updates.xhtml' ? 'tb-dest-on' : ''}"
                        title="#{updateNoticeBean.disponible ? 'Nouvelle version disponible' : 'Mises à jour'}">
                    <span class="tb-dest-icon">
                        <i class="pi pi-cloud-download"/>
                        <h:panelGroup styleClass="tb-dest-badge" rendered="#{updateNoticeBean.disponible}"/>
                    </span>
                    <span class="tb-dest-label">Mises à jour</span>
                </h:link>
            </div>

            <div class="tb-rail-end">
                <button type="button" class="tb-icon-btn tb-theme-btn" onclick="tbTheme.toggle(this)"
                        title="Changer de thème" aria-label="Changer de thème">
                    <i class="pi pi-moon tb-if-light"/><i class="pi pi-sun tb-if-dark"/>
                </button>
                <h:link outcome="/app/profil"
                        styleClass="tb-avatar #{view.viewId eq '/app/profil.xhtml' ? 'tb-avatar-on' : ''}"
                        title="Mon profil (#{loginBean.currentUser.username})">
                    #{loginBean.initiale}
                </h:link>
                <p:commandButton icon="pi pi-sign-out" title="Déconnexion" action="#{loginBean.logout}"
                                 ajax="false" styleClass="ui-button-flat tb-logout"/>
            </div>
        </nav>
    </h:form>

    <!-- Login and registration: the toggle sits in a corner -->
    <h:panelGroup rendered="#{not loginBean.loggedIn}">
        <button type="button" class="tb-icon-btn tb-theme-btn tb-theme-corner" onclick="tbTheme.toggle(this)"
                title="Changer de thème" aria-label="Changer de thème">
            <i class="pi pi-moon tb-if-light"/><i class="pi pi-sun tb-if-dark"/>
        </button>
    </h:panelGroup>

    <p:growl id="growl" showDetail="true" life="4000">
        <p:autoUpdate/>
    </p:growl>

    <h:form id="confirmForm">
        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="380">
            <p:commandButton value="Annuler" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
            <p:commandButton value="Confirmer" type="button" styleClass="ui-confirmdialog-yes ui-button-danger"/>
        </p:confirmDialog>
    </h:form>

    <main class="tb-main">
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
