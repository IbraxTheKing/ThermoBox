<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">Préférences</ui:define>

    <ui:define name="content">
        <div class="tb-narrow">
            <header class="tb-page-head">
                <div class="tb-page-title">
                    <span class="tb-eyebrow">Mon expérience</span>
                    <h1>Préférences</h1>
                </div>
            </header>

            <!-- Saved in a cookie of this browser (PreferencesBean), applied at once by tbPrefs -->
            <h:form id="prefsForm">
                <p:card>
                    <div class="tb-prefs">
                        <div class="tb-pref">
                            <span class="tb-section-icon"><i class="pi pi-play"/></span>
                            <div class="tb-pref-text">
                                <strong>Animations</strong>
                                <span class="tb-muted">
                                    Transitions entre les pages, apparition des cartes, tracé des courbes.
                                    Désactivées, tout s'affiche directement.
                                </span>
                                <span class="tb-pref-note" id="tbMotionNote" hidden="hidden">
                                    Votre appareil demande déjà de réduire les animations : elles restent réduites.
                                </span>
                            </div>
                            <p:toggleSwitch id="animations" widgetVar="animationsSwitch" value="#{preferencesBean.animations}"
                                            onchange="tbPrefs.animations(PF('animationsSwitch').input.prop('checked'))"
                                            styleClass="tb-switch"/>
                        </div>
                    </div>
                    <p class="tb-muted tb-pref-portee">Enregistré dans ce navigateur uniquement.</p>
                </p:card>
            </h:form>
            <script>tbPrefs.signalerSysteme('tbMotionNote');</script>
        </div>
    </ui:define>
</ui:composition>
