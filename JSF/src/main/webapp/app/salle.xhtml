<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="id" value="#{salleDetailBean.id}"/>
            <f:viewAction action="#{salleDetailBean.load}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="title">#{salleDetailBean.salle.name}</ui:define>

    <ui:define name="content">
        <!-- Salle introuvable -->
        <h:panelGroup layout="block" rendered="#{salleDetailBean.salle eq null}">
            <p:staticMessage severity="warn" summary="Élément introuvable"
                             detail="Cet élément n'existe pas ou a été supprimé." style="width:100%"/>
            <p:linkButton value="Retour aux bâtiments et salles" icon="pi pi-arrow-left" outcome="/app/salles"
                          styleClass="ui-button-flat"/>
        </h:panelGroup>

        <h:form id="detail" rendered="#{salleDetailBean.salle ne null}">
            <div class="tb-header">
                <!-- Transition : reçoit le nom de la carte du dashboard -->
                <div>
                    <h1 style="view-transition-name: salle-nom-#{salleDetailBean.salle.id}">#{salleDetailBean.salle.name}</h1>
                    <div class="tb-muted">
                        #{salleDetailBean.kindLabel}
                        <h:outputText value=" · #{salleDetailBean.chemin}" rendered="#{not empty salleDetailBean.chemin}"/>
                    </div>
                </div>
                <p:linkButton value="Bâtiments et salles" icon="pi pi-arrow-left" outcome="/app/salles"
                              styleClass="ui-button-flat"/>
            </div>

            <!-- Étage / bâtiment : accès direct à ce qu'il contient -->
            <h:panelGroup layout="block" styleClass="tb-row" rendered="#{not empty salleDetailBean.enfants}">
                <span class="tb-muted">Contient :</span>
                <ui:repeat value="#{salleDetailBean.enfants}" var="e">
                    <p:linkButton value="#{e.name}" outcome="/app/salle" styleClass="ui-button-outlined">
                        <f:param name="id" value="#{e.id}"/>
                    </p:linkButton>
                </ui:repeat>
            </h:panelGroup>

            <p:poll interval="30" listener="#{salleDetailBean.refresh}" update="etat boitiers"/>

            <div class="tb-grid">
                <!-- État courant (rafraîchi par le poll) -->
                <h:panelGroup id="etat" layout="block" styleClass="tb-grid tb-span-2">
                    <p:card style="view-transition-name: salle-card-#{salleDetailBean.salle.id}; view-transition-class: tb-card">
                        <div class="tb-muted">
                            #{salleDetailBean.boitier ? 'Température mesurée' : 'Moyenne des boîtiers'}
                        </div>
                        <div class="tb-temp" style="view-transition-name: salle-temp-#{salleDetailBean.salle.id}">
                            <h:outputText value="#{salleDetailBean.moyenne}"
                                          rendered="#{salleDetailBean.moyenne ne null}">
                                <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                            </h:outputText>
                            <h:outputText value="—" rendered="#{salleDetailBean.moyenne eq null}"/>
                            <span class="tb-unit">°C</span>
                        </div>
                        <h:outputText styleClass="tb-muted" value="#{salleDetailBean.derniereMesure}"
                                      rendered="#{salleDetailBean.derniereMesure ne null}">
                            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                        <h:outputText styleClass="tb-muted" value="Aucun boîtier rattaché"
                                      rendered="#{empty salleDetailBean.mesures}"/>
                    </p:card>

                    <p:card>
                        <div class="tb-muted">Consigne actuelle</div>
                        <div class="tb-temp tb-consigne">
                            <h:outputText value="#{salleDetailBean.consigne.value}"
                                          rendered="#{salleDetailBean.consigne ne null}">
                                <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                            </h:outputText>
                            <h:outputText value="—" rendered="#{salleDetailBean.consigne eq null}"/>
                            <span class="tb-unit">°C</span>
                        </div>
                        <h:outputText styleClass="tb-muted" value="#{salleDetailBean.consigne.date}"
                                      rendered="#{salleDetailBean.consigne ne null}">
                            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:card>
                </h:panelGroup>

                <!-- Envoi d'une consigne (ADMIN / GESTIONNAIRE) -->
                <p:card rendered="#{loginBean.canSetConsigne and not salleDetailBean.boitier}">
                    <div class="tb-muted">Nouvelle consigne (envoyée à tous les boîtiers)</div>
                    <div class="tb-row">
                        <p:inputNumber id="consigneInput" value="#{salleDetailBean.nouvelleConsigne}"
                                       minValue="5" maxValue="35" decimalPlaces="1" symbol=" °C"
                                       symbolPosition="s" required="true"
                                       requiredMessage="Indique une température" placeholder="ex. 20,5"/>
                        <p:commandButton value="Envoyer" icon="pi pi-send"
                                         action="#{salleDetailBean.envoyerConsigne}"
                                         process="@this consigneInput"
                                         update="etat boitiers consigneInput :detail:historique"/>
                    </div>
                    <p:message for="consigneInput"/>
                </p:card>
            </div>

            <!-- Température de chaque boîtier, à côté de la moyenne -->
            <p:panel id="boitiers" header="Boîtiers" styleClass="tb-panel" rendered="#{not salleDetailBean.boitier}">
                <p:dataTable value="#{salleDetailBean.mesures}" var="m" stripedRows="true" size="small"
                             emptyMessage="Aucun boîtier rattaché. Rattache-les depuis « Bâtiments et salles ».">
                    <p:column headerText="Boîtier">
                        <h:link outcome="/app/salle" value="#{m.boitier.name}">
                            <f:param name="id" value="#{m.boitier.id}"/>
                        </h:link>
                    </p:column>
                    <p:column headerText="Température">
                        <h:outputText value="#{m.mesure.value}" rendered="#{m.mesure ne null}">
                            <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                        </h:outputText>
                        <h:outputText value=" °C" rendered="#{m.mesure ne null}"/>
                        <h:outputText value="Pas encore de mesure" styleClass="tb-muted" rendered="#{m.mesure eq null}"/>
                    </p:column>
                    <p:column headerText="Écart à la moyenne">
                        <h:outputText value="#{salleDetailBean.ecart(m)}"/>
                    </p:column>
                    <p:column headerText="Dernière mesure">
                        <h:outputText value="#{m.mesure.date}" rendered="#{m.mesure ne null}">
                            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>
                </p:dataTable>
            </p:panel>

            <!-- Historique -->
            <p:panel id="historique" header="Historique" styleClass="tb-panel">
                <div class="tb-row">
                    <div class="tb-field tb-inline">
                        <p:outputLabel for="start" value="Du"/>
                        <p:datePicker id="start" value="#{salleDetailBean.start}" showTime="true"
                                      pattern="dd/MM/yyyy HH:mm" required="true" locale="fr"/>
                    </div>
                    <div class="tb-field tb-inline">
                        <p:outputLabel for="end" value="Au"/>
                        <p:datePicker id="end" value="#{salleDetailBean.end}" showTime="true"
                                      pattern="dd/MM/yyyy HH:mm" required="true" locale="fr"/>
                    </div>
                    <p:commandButton value="Afficher" icon="pi pi-search" action="#{salleDetailBean.loadHistory}"
                                     process="@this start end" update="historique"/>
                    <span class="tb-spacer"/>
                    <p:commandButton value="24 h" action="#{salleDetailBean.periode(24)}" process="@this"
                                     update="historique" styleClass="ui-button-outlined"/>
                    <p:commandButton value="7 j" action="#{salleDetailBean.periode(168)}" process="@this"
                                     update="historique" styleClass="ui-button-outlined"/>
                    <p:commandButton value="30 j" action="#{salleDetailBean.periode(720)}" process="@this"
                                     update="historique" styleClass="ui-button-outlined"/>
                </div>

                <p:lineChart model="#{salleDetailBean.chartModel}" style="height:360px"/>

                <h3>Consignes de la période</h3>
                <p:dataTable value="#{salleDetailBean.historiqueConsignes}" var="c" rows="10" paginator="true"
                             paginatorAlwaysVisible="false" emptyMessage="Aucune consigne sur la période"
                             stripedRows="true" size="small">
                    <p:column headerText="Date">
                        <h:outputText value="#{c.date}">
                            <f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>
                    <p:column headerText="Consigne">
                        <h:outputText value="#{c.value}">
                            <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                        </h:outputText> °C
                    </p:column>
                </p:dataTable>
            </p:panel>
        </h:form>
    </ui:define>
</ui:composition>
