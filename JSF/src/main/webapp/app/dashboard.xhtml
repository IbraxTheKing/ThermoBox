<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:pt="jakarta.faces.passthrough">

    <ui:define name="title">Aperçu</ui:define>

    <ui:define name="content">
        <h:form id="dashForm">
            <header class="tb-page-head">
                <div class="tb-page-title">
                    <span class="tb-eyebrow">Bonjour #{loginBean.currentUser.username}</span>
                    <h1>Aperçu</h1>
                </div>
                <p:commandButton icon="pi pi-refresh" title="Actualiser" action="#{dashboardBean.actualiser}"
                                 process="@this" update="grille resume" styleClass="tb-tonal" onstart="tbFlip.first()" oncomplete="tbFlip.play()"/>
            </header>

            <ui:include src="/WEB-INF/includes/update-banner.xhtml"/>

            <h:panelGroup id="resume" layout="block" styleClass="tb-summary">
                <!-- Filter chips: one click shows only the salles in that state, a second click shows them all -->
                <ui:repeat value="#{dashboardBean.compteurs}" var="c">
                    <p:commandLink action="#{dashboardBean.basculerEtat(c.etat)}" process="@this" update=":dashForm:grille :dashForm:resume" onstart="tbFlip.first()" oncomplete="tbFlip.play()"
                                   styleClass="tb-summary-chip tb-ton-#{c.etat.ton} #{dashboardBean.etatFiltre eq c.etat ? 'tb-chip-on' : ''}"
                                   pt:aria-pressed="#{dashboardBean.etatFiltre eq c.etat}"
                                   title="#{dashboardBean.etatFiltre eq c.etat ? 'Afficher toutes les salles' : 'Afficher seulement ces salles'}">
                        <i class="pi pi-check tb-chip-check"/>#{c.texte}
                    </p:commandLink>
                </ui:repeat>
            </h:panelGroup>

            <!-- The 24 h curves come in a second request, so the page shows without waiting for them -->
            <p:remoteCommand name="tbChargerCourbes" action="#{dashboardBean.chargerCourbes}" process="@this"
                             update="grille" autoRun="#{dashboardBean.courbesEnAttente}"/>

            <!-- tbWatch: the temperatures that changed since the last refresh pulse once -->
            <p:poll interval="30" listener="#{dashboardBean.refresh}" process="@this" update="grille resume"
                    onstart="tbWatch.before()" oncomplete="tbWatch.after()"/>

            <!-- Filtres : en dehors de "grille" pour garder le focus pendant la saisie -->
            <div class="tb-toolbar">
                <span class="ui-input-icon-left tb-search">
                    <i class="pi pi-search"/>
                    <p:inputText id="recherche" value="#{dashboardBean.recherche}"
                                 placeholder="Rechercher une salle, un étage, un bâtiment…"
                                 autocomplete="off">
                        <p:ajax event="keyup" delay="250" listener="#{dashboardBean.filtrer}" update="grille" onstart="tbFlip.first()" oncomplete="tbFlip.play()"/>
                    </p:inputText>
                </span>
                <p:selectOneMenu id="batiment" value="#{dashboardBean.batimentId}" styleClass="tb-filter">
                    <f:selectItem itemLabel="Tous les bâtiments" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{dashboardBean.batiments}" var="b" itemLabel="#{b.name}"
                                   itemValue="#{b.id}"/>
                    <f:selectItem itemLabel="Sans bâtiment" itemValue="#{-1}"/>
                    <p:ajax listener="#{dashboardBean.filtrer}" update="grille" onstart="tbFlip.first()" oncomplete="tbFlip.play()"/>
                </p:selectOneMenu>
            </div>

            <h:panelGroup id="grille" layout="block">
                <h:panelGroup layout="block" styleClass="tb-banner" rendered="#{loginBean.canSeeBoitiers and dashboardBean.boitiersNonRattaches gt 0}">
                    <span class="tb-banner-icon"><i class="pi pi-exclamation-triangle"/></span>
                    <div class="tb-banner-text">
                        <strong>#{dashboardBean.boitiersNonRattaches} boîtier(s) non rattaché(s)</strong>
                        <span>Leurs mesures ne comptent dans aucune salle tant qu'ils ne sont pas rattachés.</span>
                    </div>
                    <p:linkButton value="Les ranger" icon="pi pi-arrow-right" iconPos="right" outcome="/app/salles"
                                  rendered="#{loginBean.admin}" styleClass="ui-button-flat"/>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="tb-empty" rendered="#{dashboardBean.vide}">
                    <span class="tb-empty-icon"><i class="pi pi-building"/></span>
                    <strong>Aucune salle pour le moment</strong>
                    <p:linkButton value="Gérer les bâtiments et salles" outcome="/app/salles"
                                  styleClass="tb-tonal"/>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="tb-empty" rendered="#{dashboardBean.aucunResultat}">
                    <span class="tb-empty-icon"><i class="pi pi-search"/></span>
                    <strong>Aucune salle ne correspond à ta recherche</strong>
                    <p:commandButton value="Effacer les filtres" icon="pi pi-times" action="#{dashboardBean.effacerFiltres}"
                                     process="@this" update="@form" styleClass="tb-tonal" onstart="tbFlip.first()" oncomplete="tbFlip.play()"/>
                </h:panelGroup>

                <!-- Each section folds and unfolds from its title; tbSections keeps that in a cookie (#27) -->
                <ui:fragment rendered="#{not empty dashboardBean.favoris}">
                    <section class="tb-section #{dashboardBean.replie('favoris') ? 'tb-collapsed' : ''}" data-section="favoris">
                        <h2 class="tb-section-title" data-flip="groupe-favoris">
                            <button type="button" class="tb-section-toggle" aria-expanded="#{not dashboardBean.replie('favoris')}"
                                    onclick="tbSections.toggle(this)">
                                <span class="tb-section-icon tb-section-icon-fav"><i class="pi pi-star-fill"/></span>
                                Favoris
                                <span class="tb-section-meta">#{dashboardBean.favoris.size()} salle(s)</span>
                                <i class="pi pi-chevron-down tb-section-chevron"/>
                            </button>
                        </h2>
                        <div class="tb-section-body">
                            <div class="tb-cards">
                                <ui:repeat value="#{dashboardBean.favoris}" var="r">
                                    <ui:include src="/WEB-INF/includes/salle-card.xhtml"/>
                                </ui:repeat>
                            </div>
                        </div>
                    </section>
                </ui:fragment>

                <ui:repeat value="#{dashboardBean.groupes}" var="g">
                    <section class="tb-section #{dashboardBean.replie(g.cle) ? 'tb-collapsed' : ''}" data-section="#{g.cle}">
                        <h2 class="tb-section-title" data-flip="groupe-#{g.batiment ne null ? g.batiment.id : 'aucun'}">
                            <button type="button" class="tb-section-toggle" aria-expanded="#{not dashboardBean.replie(g.cle)}"
                                    onclick="tbSections.toggle(this)">
                                <span class="tb-section-icon"><i class="pi #{g.batiment ne null ? 'pi-building' : 'pi-inbox'}"/></span>
                                #{g.nom}
                                <span class="tb-section-meta">
                                    #{g.salles.size()} salle(s)
                                    <h:outputText value=" · " rendered="#{g.moyenne ne null}"/>
                                    <h:outputText value="#{g.moyenne}" rendered="#{g.moyenne ne null}">
                                        <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                                    </h:outputText>
                                    <h:outputText value=" °C en moyenne" rendered="#{g.moyenne ne null}"/>
                                </span>
                                <i class="pi pi-chevron-down tb-section-chevron"/>
                            </button>
                        </h2>
                        <div class="tb-section-body">
                            <div class="tb-cards">
                                <ui:repeat value="#{g.salles}" var="r">
                                    <ui:include src="/WEB-INF/includes/salle-card.xhtml"/>
                                </ui:repeat>
                            </div>
                        </div>
                    </section>
                </ui:repeat>
            </h:panelGroup>

            <!-- Back from a salle: the dashboard reopens where its card was, so the card glides back into place -->
            <script>tbScroll.restore();</script>
        </h:form>
    </ui:define>
</ui:composition>
