<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui">

    <ui:define name="title">Bâtiments et salles</ui:define>

    <ui:define name="content">
        <h:form id="sallesForm">
            <header class="tb-page-head">
                <div class="tb-page-title">
                    <span class="tb-eyebrow">Organisation</span>
                    <h1>Bâtiments et salles</h1>
                </div>
                <p:commandButton value="Nouveau bâtiment" icon="pi pi-plus" rendered="#{loginBean.admin}"
                                 action="#{salleBean.create('BATIMENT', null)}" process="@this"
                                 update=":salleDlgForm" oncomplete="PF('salleDlg').show()" styleClass="tb-btn-lg tb-fab"/>
            </header>

            <p class="tb-lead">
                <h:outputText rendered="#{loginBean.canSeeBoitiers}" value="Un bâtiment contient des étages ou directement des salles, une salle contient des boîtiers.
                La température d'une salle est la moyenne de ses boîtiers.
                Les boîtiers apparaissent ici d'eux-mêmes dès qu'ils se connectent."/>
                <h:outputText rendered="#{not loginBean.canSeeBoitiers}"
                              value="Un bâtiment contient des étages ou directement des salles. Touche un élément pour voir sa température."/>
                <h:outputText rendered="#{loginBean.admin}" styleClass="tb-hide-sm"
                              value="Glisse un élément sur un autre pour l'y ranger, ou entre deux éléments du premier niveau pour le détacher."/>
                <h:outputText rendered="#{loginBean.admin}" styleClass="tb-show-sm"
                              value="Fais défiler la liste normalement. Le déplacement par glisser-déposer est désactivé sur écran tactile : ouvre ⋮ pour modifier ou déplacer un élément."/>
            </p>

            <!-- onDrop: the server validates and saves the move first; a refused move never shows. -->
            <p:tree id="arbre" value="#{salleBean.arbre}" var="n" styleClass="tb-tree"
                    draggable="#{loginBean.admin}" droppable="#{loginBean.admin}"
                    onDrop="#{salleBean.onDrop}">
                <!-- Averages and "non rattaché" tags change with the move: redraw from the database. -->
                <p:ajax event="dragdrop" listener="#{salleBean.load}" update="arbre"/>

                <p:treeNode>
                    <span class="tb-node">
                        <span class="tb-node-main">
                            <i class="pi #{n.icon} tb-tree-icon"/>
                            <span class="tb-node-name">#{n.salle.name}</span>
                            <span class="tb-muted">#{n.kind.label}</span>
                            <p:tag value="Non rattaché" severity="warning" rendered="#{not n.rattache}"/>
                        </span>

                        <span class="tb-node-temp">
                            <h:outputText value="#{n.temperature}" rendered="#{n.temperature ne null}">
                                <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                            </h:outputText>
                            <h:outputText value=" °C" rendered="#{n.temperature ne null}"/>
                            <h:outputText value="—" rendered="#{n.temperature eq null}"/>
                            <h:outputText styleClass="tb-muted" value="#{n.boitiers} boîtier(s)"
                                          rendered="#{loginBean.canSeeBoitiers and n.kind ne 'BOITIER' and n.boitiers gt 0}"/>
                        </span>

                        <span class="tb-node-actions">
                            <p:linkButton icon="pi pi-eye" title="Voir" outcome="/app/salle"
                                          styleClass="ui-button-flat tb-node-keep">
                                <f:param name="id" value="#{n.salle.id}"/>
                            </p:linkButton>
                            <p:commandButton icon="pi pi-plus" title="Ajouter dans « #{n.salle.name} »"
                                             rendered="#{loginBean.admin and not empty n.kind.childKinds}"
                                             action="#{salleBean.create(n.kind.childKinds[0], n.salle)}"
                                             process="@this" update=":salleDlgForm"
                                             oncomplete="PF('salleDlg').show()" styleClass="ui-button-flat"/>
                            <p:commandButton icon="pi pi-pencil" title="Modifier / déplacer"
                                             rendered="#{loginBean.admin}"
                                             action="#{salleBean.edit(n.salle)}" process="@this"
                                             update=":salleDlgForm" oncomplete="PF('salleDlg').show()"
                                             styleClass="ui-button-flat"/>
                            <p:commandButton icon="pi pi-link" title="Détacher"
                                             rendered="#{loginBean.admin and n.rattache and n.kind ne 'BATIMENT'}"
                                             action="#{salleBean.detacher(n.salle)}" process="@this"
                                             update=":sallesForm:arbre" styleClass="ui-button-flat"/>
                            <p:commandButton icon="pi pi-trash" title="Supprimer" rendered="#{loginBean.admin}"
                                             action="#{salleBean.delete(n.salle)}" process="@this"
                                             update=":sallesForm:arbre"
                                             styleClass="ui-button-flat ui-button-danger">
                                <p:confirm header="Supprimer « #{n.salle.name} »"
                                           message="Son historique est supprimé ; ce qu'il contient est gardé mais n'est plus rattaché."
                                           icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                            <!-- Phones: every action in a bottom sheet -->
                            <p:commandButton icon="pi pi-ellipsis-v" title="Actions" rendered="#{loginBean.admin}"
                                             action="#{salleBean.choisir(n)}" process="@this" update=":actionsForm"
                                             oncomplete="PF('actionsDlg').show()"
                                             styleClass="ui-button-flat tb-node-keep tb-node-more"/>
                        </span>
                    </span>
                </p:treeNode>
            </p:tree>
        </h:form>

        <!-- On touch devices, scrolling the tree must never start a drag operation.
             Desktop drag-and-drop remains enabled for administrators. -->
        <h:outputScript target="body">
            //<![CDATA[
            (function () {
                if (!window.matchMedia || !window.matchMedia('(hover: none), (pointer: coarse)').matches) return;

                function disableTreeDragging() {
                    if (!window.jQuery) return;
                    var $tree = jQuery('#sallesForm\\:arbre');
                    if (!$tree.length) return;
                    $tree.find('.ui-treenode-content').each(function () {
                        var $node = jQuery(this);
                        if ($node.data('ui-draggable')) $node.draggable('disable');
                        if ($node.data('ui-droppable')) $node.droppable('disable');
                    });
                    $tree.find('.ui-treenode-content').css({
                        'touch-action': 'pan-y',
                        '-webkit-user-select': 'none',
                        'user-select': 'none'
                    });
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', disableTreeDragging, { once: true });
                } else {
                    disableTreeDragging();
                }

                var tree = document.getElementById('sallesForm:arbre');
                if (tree && window.MutationObserver) {
                    new MutationObserver(disableTreeDragging).observe(tree, { childList: true, subtree: true });
                }
                if (window.jQuery) {
                    jQuery(document).on('pfAjaxComplete.tbSallesTouch', function () {
                        window.requestAnimationFrame(disableTreeDragging);
                    });
                }
            })();
            //]]>
        </h:outputScript>

        <!-- Bottom sheet (phones): actions on the element picked with ⋮ -->
        <p:dialog widgetVar="actionsDlg" modal="true" resizable="false" draggable="false" showHeader="false"
                  position="bottom" styleClass="tb-sheet" dismissibleMask="true" closeOnEscape="true">
            <h:form id="actionsForm">
                <h:panelGroup rendered="#{salleBean.selection ne null}">
                    <div class="tb-sheet-handle"/>
                    <div class="tb-sheet-head">
                        <i class="pi #{salleBean.selection.icon} tb-tree-icon"/>
                        <div>
                            <strong>#{salleBean.selection.salle.name}</strong>
                            <span class="tb-muted">
                                #{salleBean.selection.kind.label}
                                <h:outputText value=" · " rendered="#{salleBean.selection.temperature ne null}"/>
                                <h:outputText value="#{salleBean.selection.temperature}"
                                              rendered="#{salleBean.selection.temperature ne null}">
                                    <f:convertNumber minFractionDigits="1" maxFractionDigits="1"/>
                                </h:outputText>
                                <h:outputText value=" °C" rendered="#{salleBean.selection.temperature ne null}"/>
                            </span>
                        </div>
                    </div>
                    <nav class="tb-sheet-list">
                        <h:link outcome="/app/salle" styleClass="tb-sheet-item">
                            <f:param name="id" value="#{salleBean.selection.salle.id}"/>
                            <i class="pi pi-eye"/>Voir le détail
                        </h:link>
                        <p:commandLink rendered="#{not empty salleBean.selection.kind.childKinds}" styleClass="tb-sheet-item"
                                       action="#{salleBean.create(salleBean.selection.kind.childKinds[0], salleBean.selection.salle)}"
                                       process="@this" update=":salleDlgForm"
                                       oncomplete="PF('actionsDlg').hide(); PF('salleDlg').show()">
                            <i class="pi pi-plus"/>Ajouter dedans
                        </p:commandLink>
                        <p:commandLink styleClass="tb-sheet-item" action="#{salleBean.edit(salleBean.selection.salle)}"
                                       process="@this" update=":salleDlgForm"
                                       oncomplete="PF('actionsDlg').hide(); PF('salleDlg').show()">
                            <i class="pi pi-pencil"/>Modifier ou déplacer
                        </p:commandLink>
                        <p:commandLink rendered="#{salleBean.selection.rattache and salleBean.selection.kind ne 'BATIMENT'}"
                                       styleClass="tb-sheet-item" action="#{salleBean.detacher(salleBean.selection.salle)}"
                                       process="@this" update=":sallesForm:arbre" oncomplete="PF('actionsDlg').hide()">
                            <i class="pi pi-link"/>Détacher
                        </p:commandLink>
                        <p:commandLink styleClass="tb-sheet-item tb-sheet-danger"
                                       action="#{salleBean.delete(salleBean.selection.salle)}"
                                       process="@this" update=":sallesForm:arbre" oncomplete="PF('actionsDlg').hide()">
                            <i class="pi pi-trash"/>Supprimer
                            <p:confirm header="Supprimer « #{salleBean.selection.salle.name} »"
                                       message="Son historique est supprimé ; ce qu'il contient est gardé mais n'est plus rattaché."
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandLink>
                    </nav>
                </h:panelGroup>
            </h:form>
        </p:dialog>

        <p:dialog header="#{salleBean.editMode ? 'Modifier' : 'Ajouter'}" widgetVar="salleDlg" modal="true"
                  resizable="false" responsive="true" width="440">
            <h:form id="salleDlgForm">
                <div class="tb-field">
                    <p:outputLabel for="kind" value="Type"/>
                    <!-- The type of an existing element can't change (it decides where it fits). -->
                    <p:selectOneMenu id="kind" value="#{salleBean.formKind}" disabled="#{salleBean.editMode}">
                        <f:selectItems value="#{salleBean.kinds}" var="k" itemLabel="#{k.label}" itemValue="#{k}"/>
                        <p:ajax listener="#{salleBean.refreshParents}" update="parentField"/>
                    </p:selectOneMenu>
                </div>
                <div class="tb-field">
                    <p:outputLabel for="nom" value="Nom"/>
                    <p:inputText id="nom" value="#{salleBean.formName}" required="true"
                                 requiredMessage="Le nom est obligatoire"/>
                    <p:message for="nom"/>
                </div>
                <h:panelGroup id="parentField" layout="block" styleClass="tb-field">
                    <h:panelGroup rendered="#{not empty salleBean.formKind.parentKinds}">
                        <p:outputLabel for="parent" value="Dans (#{salleBean.parentsLabel})"/>
                        <p:selectOneMenu id="parent" value="#{salleBean.formParentId}" filter="true"
                                         filterMatchMode="contains">
                            <f:selectItem itemLabel="— Non rattaché —" itemValue="#{null}"
                                          noSelectionOption="true"/>
                            <f:selectItems value="#{salleBean.parentsPossibles}" var="p"
                                           itemLabel="#{salleBean.libelle(p)}" itemValue="#{p.id}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                </h:panelGroup>
                <div class="tb-actions">
                    <p:commandButton value="Annuler" type="button" onclick="PF('salleDlg').hide()"
                                     styleClass="ui-button-flat"/>
                    <p:commandButton value="Enregistrer" icon="pi pi-check" action="#{salleBean.save}"
                                     update="@form :sallesForm:arbre"
                                     oncomplete="if (args &amp;&amp; args.saved) PF('salleDlg').hide()"/>
                </div>
            </h:form>
        </p:dialog>
    </ui:define>
</ui:composition>
