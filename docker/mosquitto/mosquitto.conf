# Broker MQTT de développement.
#
# Mosquitto 2.x sans fichier de configuration n'accepte que les connexions locales au
# conteneur : ce fichier ouvre le port 1883 aux autres conteneurs.
# allow_anonymous true : OK en local ; en production, ajouter un password_file (mosquitto_passwd)
# ou un TLS.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
