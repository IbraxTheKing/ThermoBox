# Development MQTT broker.
#
# Mosquitto 2.x without a configuration file only accepts connections from inside the container:
# this file opens port 1883 to the other containers.
# allow_anonymous true: fine locally; in production, add a password_file (mosquitto_passwd)
# or TLS.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
