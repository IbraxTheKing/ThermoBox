name: Nightly pre-release

on:
  schedule:
    - cron: '0 2 * * *'   # chaque jour à 02:00 UTC (04:00 à Paris en été, 03:00 en hiver)
  workflow_dispatch:       # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write          # nécessaire pour créer le tag et la release

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0   # historique complet + tags, pour comparer avec la dernière nightly

      - name: Nouveaux commits depuis la dernière nightly ?
        id: check
        run: |
          # '*nightly-*' also matches the tags of the older naming (nightly-AAAAMMJJ)
          last_tag=$(git tag --list '*nightly-*' --sort=-creatordate | head -n1)
          if [ -n "$last_tag" ] && [ "$(git rev-list -n1 "$last_tag")" = "$(git rev-parse HEAD)" ]; then
            echo "Aucun nouveau commit depuis $last_tag, rien à publier."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer le JDK 23
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Les tests ont besoin de MySQL et d'un broker MQTT, absents sur le runner :
      # on compile et on package sans les lancer. Le profil "deploy" remplit deploy/
      # (base.jar, RestServer.jar, JsfClient.war), comme pour une mise en production.
      - name: Compiler (Maven, profil deploy)
        if: steps.check.outputs.build == 'true'
        run: mvn -B -Pdeploy -DskipTests package

      # Version : <dernière version stable>-nightly-<n>, ex. 26.10.1-nightly-3.
      # La version stable est le plus grand tag de la forme X.Y.Z (ou vX.Y.Z) ; n repart à 1
      # à chaque nouvelle version stable. Sans aucun tag stable : AA.M.0 du jour.
      - name: Version
        if: steps.check.outputs.build == 'true'
        id: version
        run: |
          stable=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [ -z "$stable" ]; then stable="$(date -u +%y).$(date -u +%-m).0"; fi
          last=$(git tag --list "${stable}-nightly-*" | sed "s/^${stable}-nightly-//" | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)
          tag="${stable}-nightly-$(( ${last:-0} + 1 ))"
          echo "Version stable : $stable -> $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Les trois fichiers de deploy/, plus le dossier entier dans une archive
      - name: Rassembler les livrables
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p dist
          cp deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war dist/
          zip -j "dist/thermobox-${{ steps.version.outputs.tag }}.zip" deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war
          ls -l dist

      - name: Créer la pre-release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/* \
            --target "$(git rev-parse HEAD)" \
            --prerelease \
            --title "$tag ($(date -u +%Y-%m-%d))" \
            --generate-notes
