name: Nightly pre-release

# Nightly of the next feature version, built from the dev/ branch: after the stable 26.10.x,
# dev/ prepares 26.11.0 and the nightlies are named 26.11.0-nightly.<n> (README format; the older
# nightlies named -nightly-<n> still count). Patches (26.10.x) don't go through here: they are
# published as stable versions.
#
# Branch built: dev/<series> (e.g. dev/26.11) if it exists, otherwise the "dev" branch, otherwise
# the only dev/* branch.
# A cron only reads the workflow file of the repository's default branch.

on:
  schedule:
    - cron: '0 2 * * *'   # every day at 02:00 UTC (04:00 in Paris in summer, 03:00 in winter)
  workflow_dispatch:       # can also be started by hand from the Actions tab
    inputs:
      branch:
        description: dev/ branch to build (empty = automatic choice)
        required: false

permissions:
  contents: write          # needed to create the tag and the release

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag and every branch

      # Series: the one after the latest stable (26.10.1 -> 26.11, 26.12.x -> 27.01).
      # Without any stable version: the series of the current month.
      - name: dev/ branch and version
        id: version
        env:
          REQUESTED: ${{ inputs.branch }}
        run: |
          stable=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$stable" ]; then
            yy=$((10#$(echo "$stable" | cut -d. -f1)))
            mm=$((10#$(echo "$stable" | cut -d. -f2)))
            if [ "$mm" -eq 12 ]; then yy=$((yy + 1)); mm=1; else mm=$((mm + 1)); fi
          else
            yy=$((10#$(date -u +%y)))
            mm=$((10#$(date -u +%m)))
          fi
          series=$(printf '%d.%02d' "$yy" "$mm")

          branches=$(git branch -r --format='%(refname:short)' | sed -n 's#^origin/##p' | grep -E '^dev(/|$)' || true)
          if [ -n "$REQUESTED" ]; then
            branch="$REQUESTED"
          elif echo "$branches" | grep -qx "dev/$series"; then
            branch="dev/$series"
          elif echo "$branches" | grep -qx "dev"; then
            branch="dev"
          elif [ -n "$branches" ] && [ "$(echo "$branches" | wc -l)" -eq 1 ]; then
            branch="$branches"
          else
            echo "No dev/ branch to build (expected: dev/$series). dev/ branches: ${branches:-none}"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse -q --verify "origin/$branch^{commit}" >/dev/null; then
            echo "::error::Branch $branch not found"
            exit 1
          fi
          commit=$(git rev-parse "origin/$branch")

          base="$series.0"
          # Last nightly of the series, whichever separator it was named with
          last=$(git tag --list "${base}-nightly[.-]*" | sed -E "s/^${base//./\.}-nightly[.-]//" | grep -E '^[0-9]+$' | sort -n | tail -n1 || true)
          if [ -n "$last" ]; then
            last_tag=$(git tag --list "${base}-nightly.${last}" "${base}-nightly-${last}" | head -n1)
          fi
          if [ -n "$last" ] && [ "$(git rev-list -n1 "$last_tag")" = "$commit" ]; then
            echo "No new commit on $branch since $last_tag, nothing to publish."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag="${base}-nightly.$(( ${last:-0} + 1 ))"
          echo "Latest stable: ${stable:-none}; $branch -> $tag"
          {
            echo "build=true"
            echo "tag=$tag"
            echo "branch=$branch"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the dev/ branch
        if: steps.version.outputs.build == 'true'
        run: git checkout --detach "${{ steps.version.outputs.commit }}"

      - name: Install JDK 23
        if: steps.version.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # The tests need MySQL and an MQTT broker, missing on the runner: compile and package
      # without running them. The "deploy" profile fills deploy/ (base.jar, RestServer.jar,
      # JsfClient.war), as for a production release.
      - name: Build (Maven, deploy profile)
        if: steps.version.outputs.build == 'true'
        # -Dthermobox.version: the version the update system reads in the build
        run: mvn -B -Pdeploy -DskipTests -Dthermobox.version=${{ steps.version.outputs.tag }} package

      # The three files of deploy/, plus the whole folder in an archive
      - name: Gather the deliverables
        if: steps.version.outputs.build == 'true'
        run: |
          mkdir -p dist
          cp deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war dist/
          zip -j "dist/thermobox-${{ steps.version.outputs.tag }}.zip" deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war
          ls -l dist

      - name: Create the pre-release
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/* \
            --target "${{ steps.version.outputs.commit }}" \
            --prerelease \
            --title "$tag ($(date -u +%Y-%m-%d), ${{ steps.version.outputs.branch }})" \
            --generate-notes
