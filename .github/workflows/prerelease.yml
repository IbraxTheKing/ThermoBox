name: Beta / RC

# Started by hand (Actions tab → "Beta / RC" → Run workflow): publishes a beta or a release
# candidate of the next feature version, built from the dev branch.
#
# Number: the series after the latest stable (after 26.10.x: 26.11), then YY.MM.0-beta.N or
# YY.MM.0-rc.N, N = the latest of that type for the series + 1 (README format).
# The version is written into the build (-Dthermobox.version) and the files are attached to a
# GitHub pre-release: the update system offers them on the prerelease channel.

on:
  workflow_dispatch:
    inputs:
      type:
        description: Pre-release type
        type: choice
        options: [beta, rc]
        default: beta
        required: true
      branch:
        description: Branch to build
        default: dev
        required: true
      notes:
        description: Text added at the top of the notes (optional; "## Migration" for the operations to plan)
        required: false

permissions:
  contents: write          # create the tag and the pre-release

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every tag and every branch

      - name: Version
        id: version
        env:
          TYPE: ${{ inputs.type }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if ! git rev-parse -q --verify "origin/$BRANCH^{commit}" >/dev/null; then
            echo "::error::Branch $BRANCH not found"
            exit 1
          fi
          commit=$(git rev-parse "origin/$BRANCH")

          # Series: the one after the latest stable (26.10.1 -> 26.11, 26.12.x -> 27.01).
          stable=$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1 || true)
          if [ -n "$stable" ]; then
            yy=$((10#$(echo "$stable" | cut -d. -f1)))
            mm=$((10#$(echo "$stable" | cut -d. -f2)))
            if [ "$mm" -eq 12 ]; then yy=$((yy + 1)); mm=1; else mm=$((mm + 1)); fi
          else
            yy=$((10#$(date -u +%y)))
            mm=$((10#$(date -u +%m)))
          fi
          base=$(printf '%d.%02d.0' "$yy" "$mm")
          pattern="^${base//./\\.}-${TYPE}[.-]([0-9]+)$"

          if git rev-parse -q --verify "refs/tags/$base" >/dev/null; then
            echo "::error::$base is already published as stable: no more $TYPE for this series."
            exit 1
          fi
          if [ "$TYPE" = beta ] && git tag --list "${base}-rc*" | grep -q .; then
            echo "::warning::An RC of $base already exists: this beta will come before it in the version order."
          fi

          last=$(git tag --list "${base}-${TYPE}*" | sed -nE "s/${pattern}/\1/p" | sort -n | tail -n1 || true)
          if [ -n "$last" ]; then
            last_tag=$(git tag --list "${base}-${TYPE}.${last}" "${base}-${TYPE}-${last}" | head -n1)
            if [ "$(git rev-list -n1 "$last_tag")" = "$commit" ]; then
              echo "::error::$last_tag was already published from this commit of $BRANCH."
              exit 1
            fi
          fi
          tag="${base}-${TYPE}.$(( ${last:-0} + 1 ))"

          echo "Latest stable: ${stable:-none}; $BRANCH ($commit) -> $tag"
          {
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the branch
        run: git checkout --detach "${{ steps.version.outputs.commit }}"

      - name: Install JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      # Like the nightly: the tests need MySQL and an MQTT broker, missing on the runner.
      - name: Build (Maven, deploy profile)
        run: mvn -B -Pdeploy -DskipTests -Dthermobox.version=${{ steps.version.outputs.tag }} package

      - name: Gather the deliverables
        run: |
          mkdir -p dist
          cp deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war dist/
          zip -j "dist/thermobox-${{ steps.version.outputs.tag }}.zip" deploy/base.jar deploy/RestServer.jar deploy/JsfClient.war
          ls -l dist

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" dist/* \
            --target "${{ steps.version.outputs.commit }}" \
            --prerelease \
            --title "$tag" \
            --notes "$NOTES" \
            --generate-notes

  # The Docker image of the beta or RC (ghcr.io/<owner>/thermobox:<tag> and :beta / :rc)
  docker:
    needs: prerelease
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.prerelease.outputs.tag }}
