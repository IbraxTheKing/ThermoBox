name: Docker image

# Publishes the image of the REST server on the GitHub Container Registry, for every version:
#   ghcr.io/<owner>/thermobox:<version>       e.g. 26.12.0, 26.12.0-beta.2, 26.12.0-nightly.14
#   ghcr.io/<owner>/thermobox:latest, :26.12  the latest stable version (of the series)
#   ghcr.io/<owner>/thermobox:nightly, :beta, :rc, :alpha   the latest of each kind of pre-release
# For amd64 and arm64 (Raspberry Pi 4/5, ARM servers). Same Dockerfile as docker-compose.yml, with
# the version written into the build.
#
# Started by a release published by hand (stable, alpha…), by nightly.yml and prerelease.yml once
# their release exists (a release created by a workflow does not start other workflows), or by
# hand from the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the version to publish as an image (e.g. 26.12.0)
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read
  packages: write          # push to ghcr.io

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Image name and tags
        id: tags
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/thermobox"
          version="${TAG#v}"
          tags="$image:$version"
          case "$version" in
            *-*)  # pre-release: 26.12.0-beta.2 -> :beta
              kind=$(echo "$version" | sed -E 's/^[^-]+-([a-z]+).*/\1/')
              tags="$tags,$image:$kind" ;;
            *)    # stable: :latest and the series (:26.12), unless a newer stable exists
              newest=$(git ls-remote --tags origin | sed -n 's#.*refs/tags/v\{0,1\}\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -n1)
              if [ -z "$newest" ] || [ "$newest" = "$version" ]; then tags="$tags,$image:latest"; fi
              tags="$tags,$image:$(echo "$version" | cut -d. -f1,2)" ;;
          esac
          echo "Image tags: $tags"
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/rest/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: THERMOBOX_VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ThermoBox
            org.opencontainers.image.description=ThermoBox REST server
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.revision }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
            echo
            echo '```bash'
            echo "docker pull ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
