name: Release assets

# A version published by hand (stable, beta, rc) gets the files the update system downloads:
# RestServer.jar, base.jar, JsfClient.war (GitHub publishes their SHA-256 digest), built from the
# tag with this version number written into them.
# The release notes stay the hand-written ones. The nightlies have their own workflow.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the version to complete (e.g. 26.11.0)
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Version
        id: check
        run: |
          case "$TAG" in
            *nightly*) echo "Nightly: files already published by nightly.yml"; echo "build=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Install JDK 23
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven

      - name: Build (Maven, deploy profile)
        if: steps.check.outputs.build == 'true'
        run: mvn -B -Pdeploy -DskipTests -Dthermobox.version="$TAG" package

      # --clobber: running the workflow again replaces the files instead of failing
      - name: Attach the files to the release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" deploy/RestServer.jar deploy/base.jar deploy/JsfClient.war --clobber
